<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الخرائط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Cairo", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b2b4a 0%, #08111f 48%, #02040a 100%);
      color: white;
    }

    .site {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      padding: 28px;
    }

    .sidebar {
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar h1 {
      font-size: clamp(20px, 4vw, 30px);
      margin-bottom: 20px;
    }

    .counter {
      margin-bottom: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.25);
    }

    .counter .num {
      font-size: clamp(28px, 6vw, 44px);
      color: #ffd166;
      font-weight: 900;
    }

    .map-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: none;
    }

    .map-list::-webkit-scrollbar { display: none; }

    .cat-group {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .cat-header {
      padding: 12px 14px;
      background: rgba(255,209,102,0.18);
      color: #ffd166;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      user-select: none;
    }

    .cat-header::after {
      content: "▾";
      transition: transform 0.25s;
      font-size: 13px;
    }

    .cat-group.open > .cat-header::after { transform: rotate(-180deg); }

    .cat-body { display: none; }
    .cat-group.open > .cat-body { display: block; }

    .sub-header {
      padding: 9px 14px 9px 20px;
      background: rgba(255,255,255,0.05);
      color: #aebdda;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      user-select: none;
    }

    .sub-header::after {
      content: "▾";
      font-size: 11px;
      transition: transform 0.25s;
    }

    .sub-header.open::after { transform: rotate(-180deg); }

    .sub-group { display: none; }
    .sub-group.open { display: flex; flex-direction: column; }

    .map-item {
      border: 0;
      padding: 10px 14px 10px 24px;
      background: rgba(255,255,255,0.04);
      color: #dbe8ff;
      cursor: pointer;
      text-align: right;
      transition: 0.2s;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .map-item:hover,
    .map-item.active {
      background: rgba(255,209,102,0.2);
      color: #fff;
    }

    .map-list button:hover,
    .map-list button.active {
      background: rgba(255,209,102,0.25);
      transform: translateX(-4px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .controls button {
      border: 0;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: clamp(13px, 2vw, 16px);
    }

    .controls button:first-child {
      background: #ffd166;
      color: black;
    }

    .controls button:last-child {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .viewer {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      min-height: 60vw;
    }

    .viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.05);
      transition: 0.8s;
      background: #000;
    }

    .viewer img.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 40%);
      pointer-events: none;
    }

    .info {
      position: absolute;
      right: 20px;
      bottom: 36px;
      left: 20px;
      z-index: 5;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,209,102,0.2);
      color: #ffd166;
      margin-bottom: 10px;
      font-size: clamp(12px, 2vw, 16px);
    }

    .info h2 {
      font-size: clamp(22px, 5vw, 54px);
    }

    .progress {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 14px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#ffd166,#39a7ff);
    }

    @media (max-width: 768px) {
      .site {
        grid-template-columns: 1fr;
        grid-template-rows: auto 70vw;
        padding: 14px;
        gap: 14px;
        min-height: 100vh;
      }

      .sidebar {
        border-radius: 20px;
        padding: 16px;
      }

      .map-list {
        max-height: 200px;
      }

      .viewer {
        border-radius: 20px;
        min-height: unset;
      }

      .info {
        right: 14px;
        bottom: 28px;
        left: 14px;
      }
    }

    @media (max-width: 480px) {
      .site {
        grid-template-rows: auto 80vw;
        padding: 10px;
      }

      .sidebar h1 {
        font-size: 18px;
      }

      .controls button {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <main class="site">
    <aside class="sidebar">
      <div>
        <h1>معرض الخرائط</h1>

        <div class="counter">
          <div class="num" id="mapNumber">01</div>
          <span>الخريطة الحالية</span>
        </div>

        <div class="map-list" id="mapList"></div>
      </div>

      <div class="controls">
        <button id="pauseBtn">إيقاف</button>
      </div>
    </aside>

    <section class="viewer">
      <img id="mapImage" src="" alt="Map" />
      <div class="overlay"></div>

      <div class="info">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <div class="tag" id="mapCategory"></div>
          <div class="tag" id="mapTag"></div>
        </div>
        <h2 id="mapTitle"></h2>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </section>
  </main>

  <script>
    function encodePath(p) {
      return p.split('/').map(encodeURIComponent).join('/');
    }

    const maps = [
      { title: "الخريطة الاساسية",                  category: "عام",                ocean: "",                  image: "الخريطة الاساسية.jpg" },
      { title: "مركزية متوسط الاسواق الاجرامية",     category: "عام",                ocean: "",                  image: "مركزية متوسط  الاسواق الاجرامية.jpg" },
      { title: "مركزية الاتجار بالبشر",              category: "عام",                ocean: "",                  image: "مركزيه الاتجار بالبشر.jpg" },

      { title: "التعاون الدولي",                     category: "الحكومة",            ocean: "المحيط الهادي",     image: "الحكومة/المحيط الهادي/التعاون-الدولي.png" },

      { title: "متوسط الصمود",                       category: "الحكومة",            ocean: "المحيط الهادي",     image: "الحكومة/المحيط الهادي/متوسط-الصمود.png" },
      { title: "مكافحة غسيل الاموال",                category: "الحكومة",            ocean: "المحيط الهادي",     image: "الحكومة/المحيط الهادي/مكافحة-غسيل-الاموال.png" },

      { title: "مكافحة غسيل الاموال",                category: "الحكومة",            ocean: "المحيط الهندي",     image: "الحكومة/الهندي/مكافحة غسيل الاموال.jpg" },

      { title: "الشبكات الاجرامية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الاطلسي",    image: "الفاعلين للجرائم/المحيط الاطلسي/الشبكات الاجراميه.jpg" },
      { title: "جماعات المافيا",                     category: "الفاعلين للجرائم",   ocean: "المحيط الاطلسي",    image: "الفاعلين للجرائم/المحيط الاطلسي/جامعات-المافيا.png" },
      { title: "جهات فاعلة اجنبية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الاطلسي",    image: "الفاعلين للجرائم/المحيط الاطلسي/جهات فاعله اجنبية.jpg" },

      { title: "الشبكات الاجرامية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهادي",     image: "الفاعلين للجرائم/المحيط الهادي/الشبكات-الاجرامية.png" },
      { title: "جماعات المافيا",                     category: "الفاعلين للجرائم",   ocean: "المحيط الهادي",     image: "الفاعلين للجرائم/المحيط الهادي/جماعات-المافيا.png" },
      { title: "جهات فاعلة اجنبية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهادي",     image: "الفاعلين للجرائم/المحيط الهادي/جهات-فاعلة-اجنبية.png" },
      { title: "جهات فاعلة حكومية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهادي",     image: "الفاعلين للجرائم/المحيط الهادي/جهات-فاعلة-حكومية.png" },

      { title: "الشبكات الاجرامية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهندي",     image: "الفاعلين للجرائم/المحيط الهندي/الشبكات الاجرامية.jpg" },
      { title: "جماعات المافيا",                     category: "الفاعلين للجرائم",   ocean: "المحيط الهندي",     image: "الفاعلين للجرائم/المحيط الهندي/جماعات المافيا.jpg" },
      { title: "جهات فاعلة اجنبية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهندي",     image: "الفاعلين للجرائم/المحيط الهندي/جهات فاعلة اجنبية.jpg" },
      { title: "جهات فاعلة حكومية",                  category: "الفاعلين للجرائم",   ocean: "المحيط الهندي",     image: "الفاعلين للجرائم/المحيط الهندي/جهات فاعلة حكومية.jpg" },

      { title: "الاتجار بالاسلحة",                   category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/الاتجار بالاسلحه.jpg" },
      { title: "الاتجار بالبشر",                     category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/الاتجار بالبشر.jpg" },
      { title: "الجرائم المالية",                    category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/الجرائم المالية.jpg" },
      { title: "المخدرات الصناعية",                  category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/المخدرات الصناعية.jpg" },
      { title: "تهريب البشر",                        category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/تهريب البشر.jpg" },
      { title: "متوسط الاجرامية",                    category: "جرائم الجزر",        ocean: "المحيط الاطلسي",    image: "جرائم الجزر/المحيط الاطلسي/متؤسط الاجراميه.jpg" },

      { title: "الاتجار بالاسلحة",                   category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/الاتجار-بالاسلحه.png" },
      { title: "الاتجار بالبشر",                     category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/الاتجار-بالبشر.png" },
      { title: "الجرائم المالية",                    category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/الجرائم-المالية.png" },
      { title: "المخدرات الصناعية",                  category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/المخدرات-الصناعية.png" },
      { title: "تهريب البشر",                        category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/تهريب-البشر.png" },
      { title: "متوسط الاجرامية",                    category: "جرائم الجزر",        ocean: "المحيط الهادي",     image: "جرائم الجزر/المحيط الهادي/متؤسط-الاجراميه.png" },

      { title: "الاتجار بالاسلحة",                   category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/الاتجار بالاسلحة.jpg" },
      { title: "الاتجار بالبشر",                     category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/الاتجار بالبشر.jpg" },
      { title: "الجرائم المالية",                    category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/الجرائم المالية.jpg" },
      { title: "المخدرات الصناعية",                  category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/المخدرات الصناعية.jpg" },
      { title: "تهريب البشر",                        category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/تهريب البشر.jpg" },
      { title: "متوسط الاجرامية",                    category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/متؤسط الاجراميه.jpg" },
    ];

    const mapImage    = document.getElementById("mapImage");
    const mapTitle    = document.getElementById("mapTitle");
    const mapTag      = document.getElementById("mapTag");
    const mapCategory = document.getElementById("mapCategory");
    const mapNumber   = document.getElementById("mapNumber");
    const mapList     = document.getElementById("mapList");
    const progressBar = document.getElementById("progressBar");
    const pauseBtn    = document.getElementById("pauseBtn");

    let current = 0;
    let paused = false;
    let duration = 30000;
    let timer;
    let progressTimer;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function buildList() {
      mapList.innerHTML = "";
      const groups = {};
      maps.forEach((map, index) => {
        if (!groups[map.category]) groups[map.category] = {};
        const ocean = map.ocean || "_root";
        if (!groups[map.category][ocean]) groups[map.category][ocean] = [];
        groups[map.category][ocean].push({ map, index });
      });

      for (const [cat, oceans] of Object.entries(groups)) {
        const catGroup = document.createElement("div");
        catGroup.className = "cat-group";
        catGroup.dataset.cat = cat;

        const catHeader = document.createElement("div");
        catHeader.className = "cat-header";
        catHeader.textContent = cat;
        catHeader.onclick = () => catGroup.classList.toggle("open");
        catGroup.appendChild(catHeader);

        const catBody = document.createElement("div");
        catBody.className = "cat-body";

        for (const [ocean, items] of Object.entries(oceans)) {
          if (ocean !== "_root") {
            const subHeader = document.createElement("div");
            subHeader.className = "sub-header";
            subHeader.dataset.ocean = ocean;
            subHeader.textContent = ocean;

            const subGroup = document.createElement("div");
            subGroup.className = "sub-group";

            subHeader.onclick = () => {
              subHeader.classList.toggle("open");
              subGroup.classList.toggle("open");
            };

            items.forEach(({ map, index }) => {
              const btn = document.createElement("button");
              btn.className = "map-item";
              btn.textContent = map.title;
              btn.dataset.index = index;
              btn.onclick = () => showMap(index, true);
              subGroup.appendChild(btn);
            });

            catBody.appendChild(subHeader);
            catBody.appendChild(subGroup);
          } else {
            items.forEach(({ map, index }) => {
              const btn = document.createElement("button");
              btn.className = "map-item";
              btn.textContent = map.title;
              btn.dataset.index = index;
              btn.onclick = () => showMap(index, true);
              catBody.appendChild(btn);
            });
          }
        }

        catGroup.appendChild(catBody);
        mapList.appendChild(catGroup);
      }
    }

    function expandToMap(index) {
      const map = maps[index];
      mapList.querySelectorAll(".cat-group").forEach(g => {
        if (g.dataset.cat === map.category) {
          g.classList.add("open");
          if (map.ocean) {
            g.querySelectorAll(".sub-header").forEach(sh => {
              if (sh.dataset.ocean === map.ocean) {
                sh.classList.add("open");
                sh.nextElementSibling.classList.add("open");
              }
            });
          }
        }
      });
    }

    function updateActiveButton() {
      mapList.querySelectorAll(".map-item").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === current);
      });
    }

    function showMap(index, resetTimer = false) {
      current = (index + maps.length) % maps.length;
      const map = maps[current];

      mapImage.classList.remove("show");

      setTimeout(() => {
        mapImage.src = encodePath(map.image);
        mapImage.onload = () => mapImage.classList.add("show");
        mapImage.onerror = () => mapImage.classList.add("show");
      }, 200);

      mapTitle.textContent = map.title;
      mapTag.textContent = map.ocean || map.category;
      mapCategory.textContent = map.ocean ? map.category : "";
      mapCategory.style.display = map.ocean ? "inline-block" : "none";
      mapNumber.textContent = pad(current + 1);

      expandToMap(current);
      updateActiveButton();
      startProgress();

      if (resetTimer) restartAuto();
    }

    function randomMap() {
      let next;

      do {
        next = Math.floor(Math.random() * maps.length);
      } while (next === current && maps.length > 1);

      showMap(next, true);
    }

    function startAuto() {
      timer = setInterval(() => {
        if (!paused) randomMap();
      }, duration);
    }

    function restartAuto() {
      clearInterval(timer);
      startAuto();
    }

    function startProgress() {
      clearInterval(progressTimer);

      progressBar.style.width = "0%";
      let width = 0;

      progressTimer = setInterval(() => {
        if (!paused) {
          width += 100 / (duration / 80);
          progressBar.style.width = Math.min(width, 100) + "%";
        }
      }, 80);
    }


    pauseBtn.onclick = () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "تشغيل" : "إيقاف";
    };

    buildList();
    showMap(0);
    startAuto();
  </script>
</body>
</html>

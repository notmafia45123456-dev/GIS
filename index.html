<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الخرائط</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Cairo", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b2b4a 0%, #08111f 48%, #02040a 100%);
      color: white;
    }

    .site {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      padding: 28px;
    }

    .sidebar {
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar h1 {
      font-size: clamp(20px, 4vw, 30px);
      margin-bottom: 20px;
    }

    .counter {
      margin-bottom: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.25);
    }

    .counter .num {
      font-size: clamp(28px, 6vw, 44px);
      color: #ffd166;
      font-weight: 900;
    }

    .map-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      max-height: 45vh;
    }

    .map-list button {
      border: 0;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      text-align: right;
      transition: 0.25s;
      font-size: clamp(13px, 2vw, 16px);
    }

    .map-list button:hover,
    .map-list button.active {
      background: rgba(255,209,102,0.25);
      transform: translateX(-4px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .controls button {
      border: 0;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: clamp(13px, 2vw, 16px);
    }

    .controls button:first-child {
      background: #ffd166;
      color: black;
    }

    .controls button:last-child {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .viewer {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      min-height: 60vw;
    }

    .viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.05);
      transition: 0.8s;
      background: #000;
    }

    .viewer img.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 40%);
      pointer-events: none;
    }

    .info {
      position: absolute;
      right: 20px;
      bottom: 36px;
      left: 20px;
      z-index: 5;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,209,102,0.2);
      color: #ffd166;
      margin-bottom: 10px;
      font-size: clamp(12px, 2vw, 16px);
    }

    .info h2 {
      font-size: clamp(22px, 5vw, 54px);
    }

    .progress {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 14px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#ffd166,#39a7ff);
    }

    @media (max-width: 768px) {
      .site {
        grid-template-columns: 1fr;
        grid-template-rows: auto 70vw;
        padding: 14px;
        gap: 14px;
        min-height: 100vh;
      }

      .sidebar {
        border-radius: 20px;
        padding: 16px;
      }

      .map-list {
        max-height: 200px;
      }

      .viewer {
        border-radius: 20px;
        min-height: unset;
      }

      .info {
        right: 14px;
        bottom: 28px;
        left: 14px;
      }
    }

    @media (max-width: 480px) {
      .site {
        grid-template-rows: auto 80vw;
        padding: 10px;
      }

      .sidebar h1 {
        font-size: 18px;
      }

      .controls button {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <main class="site">
    <aside class="sidebar">
      <div>
        <h1>معرض الخرائط</h1>

        <div class="counter">
          <div class="num" id="mapNumber">01</div>
          <span>الخريطة الحالية</span>
        </div>

        <div class="map-list" id="mapList"></div>
      </div>

      <div class="controls">
        <button id="randomBtn">عشوائي</button>
        <button id="pauseBtn">إيقاف</button>
      </div>
    </aside>

    <section class="viewer">
      <img id="mapImage" src="" alt="Map" />
      <div class="overlay"></div>

      <div class="info">
        <div class="tag" id="mapTag">Map 01</div>
        <h2 id="mapTitle">الخريطة 01</h2>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </section>
  </main>

  <script>
    const maps = Array.from({ length: 45 }, (_, i) => {
      const n = String(i + 1).padStart(2, "0");
      return {
        title: `الخريطة ${n}`,
        tag: `Map ${n}`,
        image: `map_${n}.jpg`
      };
    });

    const mapImage = document.getElementById("mapImage");
    const mapTitle = document.getElementById("mapTitle");
    const mapTag = document.getElementById("mapTag");
    const mapNumber = document.getElementById("mapNumber");
    const mapList = document.getElementById("mapList");
    const progressBar = document.getElementById("progressBar");
    const pauseBtn = document.getElementById("pauseBtn");

    let current = 0;
    let paused = false;
    let duration = 6500;
    let timer;
    let progressTimer;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function buildList() {
      mapList.innerHTML = "";
      maps.forEach((map, index) => {
        const btn = document.createElement("button");
        btn.textContent = map.title;
        btn.onclick = () => showMap(index, true);
        mapList.appendChild(btn);
      });
    }

    function updateActiveButton() {
      [...mapList.children].forEach((btn, index) => {
        btn.classList.toggle("active", index === current);
      });
    }

    function showMap(index, resetTimer = false) {
      current = (index + maps.length) % maps.length;
      const map = maps[current];

      mapImage.classList.remove("show");

      setTimeout(() => {
        mapImage.src = map.image;
        mapImage.onload = () => mapImage.classList.add("show");
      }, 200);

      mapTitle.textContent = map.title;
      mapTag.textContent = map.tag;
      mapNumber.textContent = pad(current + 1);

      updateActiveButton();
      startProgress();

      if (resetTimer) restartAuto();
    }

    function randomMap() {
      let next;

      do {
        next = Math.floor(Math.random() * maps.length);
      } while (next === current && maps.length > 1);

      showMap(next, true);
    }

    function startAuto() {
      timer = setInterval(() => {
        if (!paused) randomMap();
      }, duration);
    }

    function restartAuto() {
      clearInterval(timer);
      startAuto();
    }

    function startProgress() {
      clearInterval(progressTimer);

      progressBar.style.width = "0%";
      let width = 0;

      progressTimer = setInterval(() => {
        if (!paused) {
          width += 100 / (duration / 80);
          progressBar.style.width = Math.min(width, 100) + "%";
        }
      }, 80);
    }

    document.getElementById("randomBtn").onclick = randomMap;

    pauseBtn.onclick = () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "تشغيل" : "إيقاف";
    };

    buildList();
    showMap(0);
    startAuto();
  </script>
</body>
</html>

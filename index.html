<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الخرائط الإجرامية - اللوحة التفاعلية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top right, #0d1321 0%, #030712 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.07);
      --accent: #Eab308; /* Golden Amber */
      --accent-glow: rgba(234, 179, 8, 0.25);
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --panel-radius: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Cairo", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .site {
      width: 100%;
      height: 100vh;
      max-width: 1920px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
    }

    /* Sidebar Glassmorphism */
    .sidebar {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      min-height: 0; /* Ensures the sidebar shrinks to fit grid area */
    }

    .sidebar h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      letter-spacing: -0.5px;
    }

    .sidebar h1::before {
      content: "";
      display: block;
      width: 6px;
      height: 28px;
      background: var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Counter Card */
    .counter {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      box-shadow: inset 0 2px 20px rgba(0,0,0,0.2);
    }

    .counter .details {
      display: flex;
      flex-direction: column;
    }

    .counter .label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .counter .num {
      font-size: 40px;
      color: var(--accent);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    /* Scrollable List Container */
    .map-list-wrapper {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-left: 8px;
    }

    .map-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    .map-list-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .map-list-wrapper::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }
    .map-list-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
    }
    .map-list-wrapper::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Folders / Categories */
    .cat-group {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
    }

    .cat-header {
      padding: 16px;
      background: rgba(255,255,255,0.03);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      user-select: none;
      transition: 0.2s;
    }

    .cat-header:hover {
      background: var(--glass-hover);
    }

    .cat-header::after {
      content: "▼";
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .cat-group.open {
      border-color: rgba(234, 179, 8, 0.3);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .cat-group.open > .cat-header {
      color: var(--accent);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .cat-group.open > .cat-header::after {
      transform: rotate(-180deg);
      color: var(--accent);
    }

    .cat-body {
      display: none;
    }

    .cat-group.open > .cat-body {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sub Headers / Oceans */
    .sub-header {
      padding: 12px 16px 12px 24px;
      color: #93c5fd; /* Soft Blue for sub-categories */
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .sub-header:hover {
      background: rgba(255,255,255,0.02);
    }

    .sub-header::after {
      content: "▼";
      font-size: 10px;
      transition: transform 0.3s;
    }

    .sub-header.open {
      color: #60a5fa;
    }

    .sub-header.open::after {
      transform: rotate(-180deg);
    }

    .sub-group { display: none; padding-bottom: 8px; }
    .sub-group.open { display: flex; flex-direction: column; }

    /* Items */
    .map-item {
      border: 0;
      padding: 12px 20px 12px 24px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: right;
      transition: all 0.2s ease;
      font-size: 13.5px;
      font-weight: 600;
      position: relative;
    }

    .map-item::before {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--glass-border);
      transition: 0.2s;
    }

    .map-item:hover {
      color: #fff;
      background: rgba(255,255,255,0.03);
      padding-right: 28px;
    }

    .map-item:hover::before {
      background: #fff;
      right: 12px;
    }

    .map-item.active {
      color: #000;
      background: var(--accent);
      padding-right: 28px;
      font-weight: 800;
    }

    .map-item.active::before {
      background: #000;
      right: 12px;
      width: 6px;
      height: 6px;
    }

    /* Controls Bottom */
    .controls {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
    }

    .controls button {
      flex: 1;
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      transition: 0.3s;
    }

    .controls button:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    .controls button.paused {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    /* Map Viewer Glassmorphism */
    .viewer {
      position: relative;
      background: #000;
      border-radius: var(--panel-radius);
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 1px var(--glass-border);
      display: flex;
    }

    .viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.8s ease, transform 1.2s ease;
    }

    .viewer img.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay-glass {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 25%, transparent 60%);
      padding: 40px;
      pointer-events: none;
    }

    .tags {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
    }

    .tag.primary {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: rgba(234, 179, 8, 0.4);
    }

    .info-title {
      font-size: clamp(32px, 4vw, 56px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .progress-wrapper {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 100px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #Facc15, #f59e0b);
      border-radius: 100px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Mobile Responsiveness */
    @media (max-width: 1024px) {
      body {
        overflow: hidden;
        height: 100vh;
      }
      .site {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 100vh;
        padding: 16px;
        gap: 16px;
        overflow: hidden;
      }
      .viewer {
        min-height: 0;
        height: auto;
        order: -1;
      }
      .sidebar {
        max-height: none;
        flex: 1;
        min-height: 0;
      }
    }
  </style>
</head>

      { title: "المخدرات الصناعية",                  category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/المخدرات الصناعية.jpg" },
      { title: "تهريب البشر",                        category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/تهريب البشر.jpg" },
      { title: "متوسط الاجرامية",                    category: "جرائم الجزر",        ocean: "المحيط الهندي",     image: "جرائم الجزر/المحيط الهندي/متؤسط الاجراميه.jpg" },
    ];

    const mapImage    = document.getElementById("mapImage");
    const mapTitle    = document.getElementById("mapTitle");
    const mapTag      = document.getElementById("mapTag");
    const mapCategory = document.getElementById("mapCategory");
    const mapNumber   = document.getElementById("mapNumber");
    const mapList     = document.getElementById("mapList");
    const progressBar = document.getElementById("progressBar");
    const pauseBtn    = document.getElementById("pauseBtn");

    let current = 0;
    let paused = false;
    let duration = 30000;
    let timer;
    let progressTimer;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function buildList() {
      mapList.innerHTML = "";
      const groups = {};
      maps.forEach((map, index) => {
        if (!groups[map.category]) groups[map.category] = {};
        const ocean = map.ocean || "_root";
        if (!groups[map.category][ocean]) groups[map.category][ocean] = [];
        groups[map.category][ocean].push({ map, index });
      });

      for (const [cat, oceans] of Object.entries(groups)) {
        const catGroup = document.createElement("div");
        catGroup.className = "cat-group";
        catGroup.dataset.cat = cat;

        const catHeader = document.createElement("div");
        catHeader.className = "cat-header";
        catHeader.textContent = cat;
        catHeader.onclick = () => catGroup.classList.toggle("open");
        catGroup.appendChild(catHeader);

        const catBody = document.createElement("div");
        catBody.className = "cat-body";

        for (const [ocean, items] of Object.entries(oceans)) {
          if (ocean !== "_root") {
            const subHeader = document.createElement("div");
            subHeader.className = "sub-header";
            subHeader.dataset.ocean = ocean;
            subHeader.textContent = ocean;

            const subGroup = document.createElement("div");
            subGroup.className = "sub-group";

            subHeader.onclick = () => {
              subHeader.classList.toggle("open");
              subGroup.classList.toggle("open");
            };

            items.forEach(({ map, index }) => {
              const btn = document.createElement("button");
              btn.className = "map-item";
              btn.textContent = map.title;
              btn.dataset.index = index;
              btn.onclick = () => showMap(index, true);
              subGroup.appendChild(btn);
            });

            catBody.appendChild(subHeader);
            catBody.appendChild(subGroup);
          } else {
            items.forEach(({ map, index }) => {
              const btn = document.createElement("button");
              btn.className = "map-item";
              btn.textContent = map.title;
              btn.dataset.index = index;
              btn.onclick = () => showMap(index, true);
              catBody.appendChild(btn);
            });
          }
        }

        catGroup.appendChild(catBody);
        mapList.appendChild(catGroup);
      }
    }

    function expandToMap(index) {
      const map = maps[index];
      mapList.querySelectorAll(".cat-group").forEach(g => {
        if (g.dataset.cat === map.category) {
          g.classList.add("open");
          if (map.ocean) {
            g.querySelectorAll(".sub-header").forEach(sh => {
              if (sh.dataset.ocean === map.ocean) {
                sh.classList.add("open");
                sh.nextElementSibling.classList.add("open");
              }
            });
          }
        }
      });
    }

    function updateActiveButton() {
      mapList.querySelectorAll(".map-item").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === current);
      });
    }

    function showMap(index, resetTimer = false) {
      current = (index + maps.length) % maps.length;
      const map = maps[current];

      mapImage.classList.remove("show");

      setTimeout(() => {
        mapImage.src = encodePath(map.image);
        mapImage.onload = () => mapImage.classList.add("show");
        mapImage.onerror = () => mapImage.classList.add("show");
      }, 200);

      mapTitle.textContent = map.title;
      mapTag.textContent = map.ocean || map.category;
      mapCategory.textContent = map.ocean ? map.category : "";
      mapCategory.style.display = map.ocean ? "inline-block" : "none";
      mapNumber.textContent = pad(current + 1);

      expandToMap(current);
      updateActiveButton();
      startProgress();

      if (resetTimer) restartAuto();
    }

    function randomMap() {
      let next;

      do {
        next = Math.floor(Math.random() * maps.length);
      } while (next === current && maps.length > 1);

      showMap(next, true);
    }

    function startAuto() {
      timer = setInterval(() => {
        if (!paused) randomMap();
      }, duration);
    }

    function restartAuto() {
      clearInterval(timer);
      startAuto();
    }

    function startProgress() {
      clearInterval(progressTimer);

      progressBar.style.width = "0%";
      let width = 0;

      progressTimer = setInterval(() => {
        if (!paused) {
          width += 100 / (duration / 80);
          progressBar.style.width = Math.min(width, 100) + "%";
        }
      }, 80);
    }


    pauseBtn.onclick = () => {
      paused = !paused;
      if (paused) {
        pauseBtn.textContent = "تشغيل العرض التلقائي";
        pauseBtn.classList.add("paused");
      } else {
        pauseBtn.textContent = "إيقاف العرض التلقائي";
        pauseBtn.classList.remove("paused");
      }
    };

    buildList();
    showMap(0);
    startAuto();
  </script>
</body>
</html>

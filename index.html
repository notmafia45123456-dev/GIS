<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الخرائط الاحترافي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Cairo", "Tahoma", sans-serif;
    }

    :root {
      --gold: #ffd166;
      --blue: #39a7ff;
      --cyan: #49f2d6;
      --dark: #050914;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background: #02040a;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(57, 167, 255, 0.28), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(255, 209, 102, 0.18), transparent 28%),
        radial-gradient(circle at 70% 90%, rgba(73, 242, 214, 0.15), transparent 32%),
        linear-gradient(135deg, #02040a 0%, #07152a 45%, #02040a 100%);
      z-index: -4;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at center, #000 0%, transparent 74%);
      animation: gridMove 16s linear infinite;
    }

    @keyframes gridMove {
      to { background-position: 54px 54px; }
    }

    .orb {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.55;
      z-index: -2;
      animation: orbFloat 10s ease-in-out infinite alternate;
    }

    .orb.one { top: -90px; right: -80px; background: #0f8cff; }
    .orb.two { bottom: -100px; left: -90px; background: #ffb703; animation-delay: 1.5s; }
    .orb.three { top: 42%; left: 38%; background: #34f5c5; opacity: 0.18; animation-delay: 2.5s; }

    @keyframes orbFloat {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(-42px,32px,0) scale(1.18); }
    }

    .site {
      height: 100vh;
      width: 100vw;
      padding: 22px;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 22px;
    }

    .panel,
    .stage,
    .filmstrip {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.055));
      backdrop-filter: blur(22px);
      box-shadow: 0 28px 90px rgba(0,0,0,0.42);
    }

    .panel {
      border-radius: 34px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: hidden;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo-mark {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #06101c;
      background: linear-gradient(135deg, var(--gold), var(--cyan));
      box-shadow: 0 0 42px rgba(255, 209, 102, 0.3);
    }

    .logo h1 {
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .logo small {
      color: #aebdda;
      display: block;
      margin-top: 5px;
    }

    .hero-note {
      color: #c7d7f2;
      line-height: 1.85;
      font-size: 14px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.09);
    }

    .stat strong {
      font-size: 34px;
      color: var(--gold);
      display: block;
      line-height: 1;
    }

    .stat span {
      color: #b8c7df;
      font-size: 13px;
      margin-top: 8px;
      display: block;
    }

    .search {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      outline: none;
      color: #fff;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(0,0,0,0.28);
      font-size: 14px;
    }

    .search::placeholder { color: #8190ab; }

    .map-list {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-left: 4px;
    }

    .map-list::-webkit-scrollbar { width: 5px; }
    .map-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 999px; }

    .map-list button {
      border: 0;
      outline: 0;
      cursor: pointer;
      color: #dbe8ff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 13px 14px;
      border-radius: 16px;
      text-align: right;
      transition: 0.25s ease;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .map-list button span {
      color: var(--gold);
      font-size: 12px;
      opacity: 0.9;
    }

    .map-list button:hover,
    .map-list button.active {
      background: linear-gradient(135deg, rgba(255,209,102,0.26), rgba(57,167,255,0.18));
      transform: translateX(-4px);
      color: #fff;
      border-color: rgba(255,209,102,0.35);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .controls button,
    .mini-controls button {
      border: 0;
      cursor: pointer;
      padding: 14px 10px;
      border-radius: 18px;
      color: #06101c;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #fff1b8);
      transition: 0.25s;
    }

    .controls button.secondary,
    .mini-controls button.secondary {
      color: #fff;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .controls button:hover,
    .mini-controls button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .main {
      display: grid;
      grid-template-rows: 1fr 132px;
      gap: 18px;
      min-width: 0;
    }

    .stage {
      position: relative;
      border-radius: 38px;
      overflow: hidden;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.11);
      pointer-events: none;
      z-index: 5;
    }

    .map-frame {
      position: absolute;
      inset: 16px;
      border-radius: 30px;
      overflow: hidden;
      background: #02040a;
    }

    .map-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background:
        radial-gradient(circle at center, rgba(57,167,255,0.08), transparent 34%),
        #030711;
      opacity: 0;
      transform: scale(1.08) translateY(18px);
      filter: saturate(1.06) contrast(1.04);
      transition: opacity 0.85s ease, transform 1.15s cubic-bezier(.2,.8,.2,1);
    }

    .map-frame img.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .cinematic-overlay {
      position: absolute;
      inset: 16px;
      border-radius: 30px;
      pointer-events: none;
      z-index: 3;
      background:
        linear-gradient(to top, rgba(0,0,0,0.78), transparent 38%),
        linear-gradient(to left, rgba(0,0,0,0.42), transparent 35%),
        linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 20%);
    }

    .topbar {
      position: absolute;
      z-index: 8;
      top: 36px;
      right: 38px;
      left: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .live-badge,
    .quality-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(0,0,0,0.36);
      border: 1px solid rgba(255,255,255,0.13);
      color: #eaf3ff;
      font-size: 13px;
      backdrop-filter: blur(14px);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #37ff9f;
      box-shadow: 0 0 18px #37ff9f;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .map-info {
      position: absolute;
      z-index: 8;
      right: 46px;
      bottom: 48px;
      left: 220px;
    }

    .tag {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.28);
      color: #ffe9a8;
      margin-bottom: 13px;
      font-size: 14px;
      box-shadow: 0 0 30px rgba(255,209,102,0.13);
    }

    .map-info h2 {
      font-size: clamp(34px, 5vw, 72px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      text-shadow: 0 12px 36px rgba(0,0,0,0.72);
    }

    .big-number {
      position: absolute;
      z-index: 4;
      left: 40px;
      bottom: 36px;
      font-size: clamp(72px, 12vw, 170px);
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      letter-spacing: -6px;
      line-height: 0.85;
      pointer-events: none;
    }

    .mini-controls {
      position: absolute;
      z-index: 9;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mini-controls button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 0;
      font-size: 25px;
      display: grid;
      place-items: center;
    }

    .progress {
      position: absolute;
      z-index: 9;
      left: 40px;
      right: 40px;
      bottom: 24px;
      height: 5px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--cyan), var(--blue));
      box-shadow: 0 0 18px rgba(73,242,214,0.45);
    }

    .filmstrip {
      border-radius: 28px;
      padding: 14px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .filmstrip::-webkit-scrollbar { height: 6px; }
    .filmstrip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 999px; }

    .thumb {
      min-width: 150px;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
      transition: 0.25s;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.78;
      transition: 0.25s;
    }

    .thumb span {
      position: absolute;
      right: 9px;
      bottom: 8px;
      left: 9px;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 2px 10px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb.active,
    .thumb:hover {
      transform: translateY(-4px);
      border-color: rgba(255,209,102,0.72);
      box-shadow: 0 14px 35px rgba(0,0,0,0.35);
    }

    .thumb.active img,
    .thumb:hover img { opacity: 1; transform: scale(1.07); }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .site {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        padding: 14px;
      }
      .panel { min-height: auto; }
      .main { grid-template-rows: 620px 126px; }
      .map-list { max-height: 230px; }
    }

    @media (max-width: 650px) {
      .main { grid-template-rows: 540px 110px; }
      .panel { border-radius: 26px; padding: 18px; }
      .stage { border-radius: 28px; }
      .map-info { right: 28px; left: 28px; bottom: 50px; }
      .map-info h2 { font-size: 34px; }
      .mini-controls { left: 28px; top: 96px; transform: none; flex-direction: row; }
      .big-number { display: none; }
      .topbar { right: 28px; left: 28px; top: 28px; }
      .quality-badge { display: none; }
      .thumb { min-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <main class="site">
    <aside class="panel">
      <div class="logo">
        <div class="logo-mark">GIS</div>
        <div>
          <h1>معرض خرائط المشروع</h1>
          <small>Professional Interactive Map Gallery</small>
        </div>
      </div>

      <div class="hero-note">
        منصة عرض خرائط احترافية بتبديل عشوائي تلقائي، واجهة سينمائية، قائمة منظمة، وبحث سريع داخل 45 خريطة.
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="mapNumber">01</strong>
          <span>الخريطة الحالية</span>
        </div>
        <div class="stat">
          <strong>45</strong>
          <span>2إجمالي الخرائط</span>
        </div>
      </div>

      <input class="search" id="searchInput" type="text" placeholder="ابحث باسم الخريطة..." />

      <div class="map-list" id="mapList"></div>

      <div class="controls">
        <button id="randomBtn">خريطة عشوائية</button>
        <button class="secondary" id="pauseBtn">إيقاف مؤقت</button>
      </div>
    </aside>

    <section class="main">
      <div class="stage">
        <div class="map-frame">
          <img id="mapImage" src="" alt="خريطة المشروع" />
        </div>
        <div class="cinematic-overlay"></div>

        <div class="topbar">
          <div class="live-badge"><span class="dot"></span> عرض تلقائي مباشر</div>
          <div class="quality-badge">4K GIS Presentation</div>
        </div>

        <div class="mini-controls">
          <button class="secondary" id="nextBtn" title="التالي">›</button>
          <button class="secondary" id="prevBtn" title="السابق">‹</button>
        </div>

        <div class="big-number" id="bigNumber">01</div>

        <div class="map-info">
          <div class="tag" id="mapTag">Map 01</div>
          <h2 id="mapTitle">الخريطة 01</h2>
        </div>

        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <div class="filmstrip" id="filmstrip"></div>
    </section>
  </main>

  <script>
    /*
      حط صور الخرائط داخل فولدر maps بنفس الأسماء:
      map_01.png لحد map_45.png
      ولو عاوز تغير عنوان أي خريطة، غيّر title فقط.
    */

    const maps = Array.from({ length: 45 }, (_, i) => {
      const n = String(i + 1).padStart(2, "0");
      return {
        title: `الخريطة ${n}`,
        tag: `Map ${n}`,
        image: `maps/map_${n}.png`
      };
    });

    const mapImage = document.getElementById("mapImage");
    const mapTitle = document.getElementById("mapTitle");
    const mapTag = document.getElementById("mapTag");
    const mapNumber = document.getElementById("mapNumber");
    const bigNumber = document.getElementById("bigNumber");
    const mapList = document.getElementById("mapList");
    const filmstrip = document.getElementById("filmstrip");
    const progressBar = document.getElementById("progressBar");
    const pauseBtn = document.getElementById("pauseBtn");
    const searchInput = document.getElementById("searchInput");

    let current = 0;
    let paused = false;
    let duration = 6500;
    let timer;
    let progressTimer;
    let filteredIndexes = maps.map((_, i) => i);

    const pad = num => String(num).padStart(2, "0");

    function buildList() {
      mapList.innerHTML = "";
      filteredIndexes.forEach(index => {
        const map = maps[index];
        const btn = document.createElement("button");
        btn.innerHTML = `<b>${map.title}</b><span>${map.tag}</span>`;
        btn.onclick = () => showMap(index, true);
        btn.dataset.index = index;
        mapList.appendChild(btn);
      });
      updateActiveButton();
    }

    function buildFilmstrip() {
      filmstrip.innerHTML = "";
      maps.forEach((map, index) => {
        const item = document.createElement("div");
        item.className = "thumb";
        item.onclick = () => showMap(index, true);
        item.dataset.index = index;
        item.innerHTML = `<img src="${map.image}" alt="${map.title}" onerror="this.style.opacity='0.12'" /><span>${map.title}</span>`;
        filmstrip.appendChild(item);
      });
    }

    function updateActiveButton() {
      [...mapList.children].forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.index) === current);
      });
      [...filmstrip.children].forEach(thumb => {
        thumb.classList.toggle("active", Number(thumb.dataset.index) === current);
      });
      const activeThumb = filmstrip.querySelector(".thumb.active");
      if (activeThumb) activeThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }

    function showMap(index, resetTimer = false) {
      current = (index + maps.length) % maps.length;
      const map = maps[current];

      mapImage.classList.remove("show");
      setTimeout(() => {
        mapImage.src = map.image;
        mapImage.onload = () => mapImage.classList.add("show");
        mapImage.onerror = () => mapImage.classList.add("show");
      }, 180);

      mapTitle.textContent = map.title;
      mapTag.textContent = map.tag;
      mapNumber.textContent = pad(current + 1);
      bigNumber.textContent = pad(current + 1);
      updateActiveButton();
      startProgress();

      if (resetTimer) restartAuto();
    }

    function randomMap() {
      let next;
      do {
        next = Math.floor(Math.random() * maps.length);
      } while (next === current && maps.length > 1);
      showMap(next, true);
    }

    function nextMap() { showMap(current + 1, true); }
    function prevMap() { showMap(current - 1, true); }

    function startAuto() {
      timer = setInterval(() => {
        if (!paused) randomMap();
      }, duration);
    }

    function restartAuto() {
      clearInterval(timer);
      startAuto();
    }

    function startProgress() {
      clearInterval(progressTimer);
      progressBar.style.width = "0%";
      let width = 0;
      progressTimer = setInterval(() => {
        if (!paused) {
          width += 100 / (duration / 80);
          progressBar.style.width = Math.min(width, 100) + "%";
        }
      }, 80);
    }

    searchInput.addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      filteredIndexes = maps
        .map((map, index) => ({ map, index }))
        .filter(({ map }) => map.title.toLowerCase().includes(q) || map.tag.toLowerCase().includes(q))
        .map(({ index }) => index);
      buildList();
    });

    document.getElementById("randomBtn").onclick = randomMap;
    document.getElementById("nextBtn").onclick = nextMap;
    document.getElementById("prevBtn").onclick = prevMap;

    pauseBtn.onclick = () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "تشغيل العرض" : "إيقاف مؤقت";
    };

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") prevMap();
      if (e.key === "ArrowLeft") nextMap();
      if (e.key === " ") {
        e.preventDefault();
        pauseBtn.click();
      }
    });

    buildList();
    buildFilmstrip();
    showMap(0);
    startAuto();
  </script>
</body>
</html>
